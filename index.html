<title>등불 원정대</title>
<style>
  :root { --bg: #0b0912; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  /* scaled by whole numbers in screen.js: every game pixel is a crisp square */
  #game { position: fixed; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
</style>

<body>
<canvas id="game"></canvas>
<div id="lock" hidden>
<form id="lock-form" autocomplete="off">
<div class="lock-title">등불 원정대</div>
<div class="lock-sub">비밀번호를 넣어 주세요</div>
<input id="lock-pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="비밀번호" enterkeyhint="go">
<button id="lock-go" type="submit">열기</button>
<div id="lock-err" role="alert"></div>
</form>
</div>
<style>
  #lock { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 42%, #2a1d12 0, #0b0912 62%); font-family: system-ui, sans-serif; color: #f1e6d2; }
  #lock[hidden] { display: none; }
  #lock-form { display: flex; flex-direction: column; gap: 12px; width: min(280px, 80vw); padding: 24px 22px;
    background: #1a1424; border: 2px solid #c79a52; box-shadow: 0 0 0 2px #0b0912, 0 0 48px #ffb04a33; }
  .lock-title { font-size: 24px; font-weight: 700; letter-spacing: 2px; text-align: center; color: #ffd36a; }
  .lock-sub { font-size: 14px; text-align: center; color: #8a7ea6; }
  #lock-pw { font-size: 16px; padding: 10px; border: 2px solid #4a3a5c; border-radius: 0; background: #0e0b14; color: #f1e6d2;
    -webkit-user-select: text; user-select: text; }
  #lock-pw:focus { outline: none; border-color: #ffd36a; }
  #lock-go { font-size: 16px; font-weight: 700; padding: 10px; border: 2px solid #ffd36a; border-radius: 0; background: #3b2c22; color: #ffd36a; }
  #lock-go:active { background: #5a432f; }
  #lock-go:disabled { opacity: 0.6; }
  #lock-err { min-height: 18px; font-size: 13px; text-align: center; color: #ff7a64; }
</style>
